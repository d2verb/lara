# All ports bind to 127.0.0.1: pgweb and Redis have no auth, and Docker bypasses host firewalls
services:
  app:
    build:
      context: .
      dockerfile: docker/app/Dockerfile
      target: dev
      args:
        USER_UID: "${USER_UID:-1000}"
        USER_GID: "${USER_GID:-1000}"
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:8080"
      - "127.0.0.1:${VITE_PORT:-5173}:5173"
    volumes:
      - ./src:/app
      - ./docker/app/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./docker/app/php/php.ini:/usr/local/etc/php/conf.d/app-php.ini:ro
      - ./docker/app/php/xdebug.ini:/usr/local/etc/php/conf.d/app-xdebug.ini:ro
    environment:
      APP_ENV: "${APP_ENV:-local}"
      XDEBUG_MODE: "${XDEBUG_MODE:-off}"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    image: postgres:19-trixie
    environment:
      POSTGRES_DB: "${DB_DATABASE:-laravel}"
      POSTGRES_USER: "${DB_USERNAME:-laravel}"
      POSTGRES_PASSWORD: "${DB_PASSWORD:-secret}"
    ports:
      - "127.0.0.1:${DB_FORWARD_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-laravel}"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:8-trixie
    ports:
      - "127.0.0.1:${REDIS_FORWARD_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  rustfs:
    image: rustfs/rustfs:1.0.6
    command: server /data --console-address ":9001"
    environment:
      RUSTFS_ROOT_USER: "${AWS_ACCESS_KEY_ID:-laravel}"
      RUSTFS_ROOT_PASSWORD: "${AWS_SECRET_ACCESS_KEY:-laravelS3secret}"
    ports:
      - "127.0.0.1:${S3_PORT:-9000}:9000"
      - "127.0.0.1:${S3_CONSOLE_PORT:-9001}:9001"
    volumes:
      - rustfs_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -so /dev/null -w '%{http_code}' http://localhost:9000 | grep -q 403"]
      interval: 5s
      timeout: 3s
      retries: 5

  pgweb:
    image: sosedoff/pgweb:0.17.0
    ports:
      - "127.0.0.1:${PGWEB_PORT:-8081}:8081"
    environment:
      PGWEB_DATABASE_URL: "postgres://${DB_USERNAME:-laravel}:${DB_PASSWORD:-secret}@postgres:5432/${DB_DATABASE:-laravel}?sslmode=disable"
    depends_on:
      postgres:
        condition: service_healthy

  # One-shot: creates the default S3 bucket on first startup
  rustfs-init:
    image: rustfs/rc:v0.1.38
    depends_on:
      rustfs:
        condition: service_healthy
    entrypoint: >
      sh -c "
      rc alias set local http://rustfs:9000 $${AWS_ACCESS_KEY_ID} $${AWS_SECRET_ACCESS_KEY} &&
      rc bucket create --ignore-existing local/$${AWS_BUCKET} &&
      echo 'Bucket ready: '$${AWS_BUCKET}
      "
    environment:
      AWS_ACCESS_KEY_ID: "${AWS_ACCESS_KEY_ID:-laravel}"
      AWS_SECRET_ACCESS_KEY: "${AWS_SECRET_ACCESS_KEY:-laravelS3secret}"
      AWS_BUCKET: "${AWS_BUCKET:-laravel}"

volumes:
  postgres_data:
  redis_data:
  rustfs_data:
